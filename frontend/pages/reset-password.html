
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | TokenTrail</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/reset-password.js" defer></script>
</head>

<body>

    <main class="auth-layout">

        <section class="auth-visual">

            <nav class="auth-nav">
                <a href="../index.html" class="logo">
                    TokenTrail<span>.</span>
                </a>
            </nav>

            <div class="visual-content">

                <p class="eyebrow">ACCOUNT RECOVERY</p>

                <h1>
                    New password.<br>
                    <span>New beginning.</span>
                </h1>

                <p class="visual-description">
                    Choose a new password to secure your TokenTrail account
                    and continue exploring the AI frontier.
                </p>

            </div>

            <div class="visual-footer">
                FOLLOW THE AI FRONTIER.
            </div>

        </section>

        <section class="auth-form-section">

            <div class="auth-form-container">

                <p class="eyebrow">RESET PASSWORD</p>

                <h2>Create a new password.</h2>

                <p class="form-description">
                    Your new password must contain at least 8 characters.
                </p>

                <form id="reset-password-form">

                    <div class="form-group">

                        <label for="new-password">New password</label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="new-password"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="new-password"
                            >
                                Show
                            </button>

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="confirm-password">Confirm password</label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirm-password"
                                placeholder="Confirm new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirm-password"
                            >
                                Show
                            </button>

                        </div>

                    </div>

                    <button type="submit" class="auth-button">
                        Update password <span>→</span>
                    </button>

                </form>

                <p id="form-message" role="status" aria-live="polite"></p>

                <a href="login.html" class="back-home">
                    ← Back to sign in
                </a>

            </div>

        </section>

    </main>

</body>
</html>
